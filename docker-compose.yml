services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tripbase
      POSTGRES_PASSWORD: tripbase
      POSTGRES_DB: tripbase
    ports:
      - "5432:5432"
    volumes:
      - tripbase_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tripbase -d tripbase"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      args:
        # Only used so `prisma generate`/`next build` see a syntactically
        # valid value at build time (env.ts requires both to be set) — no
        # DB connection or session signing happens during build. The real
        # values come from `environment:` below at container start.
        DATABASE_URL: postgresql://tripbase:tripbase@db:5432/tripbase
        AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me-please-32chars}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://tripbase:tripbase@db:5432/tripbase
      AUTH_SECRET: ${AUTH_SECRET:-dev-only-secret-change-me-please-32chars}
    ports:
      # Override with `WEB_PORT=3001 docker compose up` if 3000 is taken.
      - "${WEB_PORT:-3000}:3000"
    volumes:
      # User uploads (avatars: src/server/storage/avatar.ts, Trip Story
      # photos: src/server/storage/story-photo.ts) — persists across image
      # rebuilds. Next.js serves public/ straight off disk at runtime, so
      # anything written under here is immediately reachable at
      # /uploads/<subfolder>/<file> with no extra routing. One volume
      # covers the whole uploads/ tree, so a new upload folder never needs
      # a new volume entry.
      - avatar_uploads:/app/public/uploads

volumes:
  tripbase_db_data:
  avatar_uploads:
